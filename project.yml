name: SimpleIOS

options:
  bundleIdPrefix: com.simpleios
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  SimpleIOS:
    type: application
    platform: iOS
    sources:
      - ContentView.swift
      - SimpleIOSApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simpleios.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
